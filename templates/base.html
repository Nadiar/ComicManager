<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}ComicManager{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="https://unpkg.com/htmx.org@2/dist/htmx.min.js"></script>
</head>
<body class="min-h-screen bg-base-100">

  <!-- Navbar -->
  <div class="navbar bg-base-200 border-b border-base-300 px-4">
    <div class="navbar-start">
      <a href="/" class="text-xl font-bold text-primary">ComicManager</a>
    </div>
    <div class="navbar-center hidden lg:flex">
      <ul class="menu menu-horizontal px-1 gap-1">
        <li><a href="/" class="{% block nav_dashboard %}{% endblock %}">Dashboard</a></li>
        <li><a href="/comics/" class="{% block nav_comics %}{% endblock %}">Comics</a></li>
        <li><a href="/physical/" class="{% block nav_physical %}{% endblock %}">Physical</a></li>
        <li>
          <details>
            <summary>Workflow</summary>
            <ul class="p-2 bg-base-200 rounded-box z-10 w-48">
              <li><a href="/scraper/">Scraper</a></li>
              <li><a href="/tagging/rulesets/">DataManager Rules</a></li>
              <li><a href="/organizer/profiles/">Organizer</a></li>
              <li><a href="/duplicates/">Duplicates</a></li>
            </ul>
          </details>
        </li>
        <li><a href="/settings/" class="{% block nav_settings %}{% endblock %}">Settings</a></li>
      </ul>
    </div>
    <div class="navbar-end">
      <span class="text-xs text-base-content/50">v0.1.0</span>
    </div>
  </div>

  <!-- Messages -->
  {% if messages %}
  <div class="p-4 space-y-2">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }}">
      <span>{{ message }}</span>
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <!-- Main content -->
  <main class="p-6">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
