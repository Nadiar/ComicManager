  <!-- ── Sidebar ── -->
  <aside class="cm-sidebar" id="cm-sidebar">

    <div class="cm-sb-header">
      {{ logo_svg }}
      <span class="cm-sb-brand">ComicManager</span>
    </div>

    <nav class="cm-sb-nav">

      <!-- Main -->
      <div class="cm-sb-group-label">Main</div>
      <a href="/" class="cm-sb-item {% if request.path == '/' %}active{% endif %}">
        <svg class="cm-sb-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
        <span class="cm-sb-item-label">Dashboard</span>
      </a>
      <a href="/comics/" class="cm-sb-item {% if '/comics/' in request.path and not request.GET.state and request.path != '/comics/format/' and request.GET.medium != 'physical' and '/comics/series-audit/' not in request.path %}active{% endif %}">
        <svg class="cm-sb-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="1" width="9" height="13" rx="1.5"/><rect x="5" y="3" width="9" height="13" rx="1.5"/></svg>
        <span class="cm-sb-item-label">Comics</span>
      </a>
      <a href="/physical/" class="cm-sb-item {% if '/physical/' in request.path or request.GET.medium == 'physical' %}active{% endif %}">
        <svg class="cm-sb-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 2h3v12H3z"/><path d="M7 4h2v10H7z"/><path d="M11 5h2v9h-2z"/><path d="M2 14h12"/></svg>
        <span class="cm-sb-item-label">Physical</span>
      </a>
      <a href="/smartlists/" class="cm-sb-item {% if '/smartlists/' in request.path %}active{% endif %}">
        <svg class="cm-sb-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h8M2 12h5"/></svg>
        <span class="cm-sb-item-label">Smart Lists</span>
      </a>
      <a href="{% url 'core:character_audit_search' %}" class="cm-sb-item {% if '/audit/' in request.path or 'character' in request.path or '/comics/series-audit/' in request.path %}active{% endif %}">
        <svg class="cm-sb-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="10" height="11" rx="1"/><path d="M5.5 2.5h5v2h-5z"/><path d="M5 9l2 2 4-4"/></svg>
        <span class="cm-sb-item-label">Series Audit</span>
      </a>

      <!-- Workflow -->
      <div class="cm-sb-group-label">Workflow</div>
      <a href="/comics/?state=new"     class="cm-sb-item {% if request.GET.state == 'new' %}active{% endif %}">
        <svg class="cm-sb-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v6M5 8h6"/></svg>
        <span class="cm-sb-item-label">1. New</span>
      </a>
      <a href="/comics/?state=scrape"  class="cm-sb-item {% if request.GET.state == 'scrape' %}active{% endif %}">
        <svg class="cm-sb-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4"/><path d="M10.5 10.5l3 3"/></svg>
        <span class="cm-sb-item-label">2. Scrape</span>
      </a>
      <a href="/comics/?state=tagging" class="cm-sb-item {% if request.GET.state == 'tagging' %}active{% endif %}">
        <svg class="cm-sb-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8l5-5h6v6l-5 5-6-6z"/><circle cx="10" cy="6" r="1.2" fill="currentColor" stroke="none"/></svg>
        <span class="cm-sb-item-label">3. Tagging</span>
      </a>
      <a href="/comics/format/"        class="cm-sb-item {% if '/comics/format/' in request.path %}active{% endif %}">
        <svg class="cm-sb-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 2h7l4 4v8a1 1 0 01-1 1H4a1 1 0 01-1-1V3a1 1 0 011-1z"/><path d="M10 2v4h4"/><path d="M5 9h6M5 12h4"/></svg>
        <span class="cm-sb-item-label">4. Formats</span>
      </a>
      <a href="/duplicates/"           class="cm-sb-item {% if '/duplicates/' in request.path %}active{% endif %}">
        <svg class="cm-sb-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="8" height="10" rx="1.5"/><rect x="6" y="4" width="8" height="10" rx="1.5"/></svg>
        <span class="cm-sb-item-label">5. Deduplicate</span>
      </a>
      <a href="/comics/?state=move"    class="cm-sb-item {% if request.GET.state == 'move' %}active{% endif %}">
        <svg class="cm-sb-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12V5a1 1 0 011-1h4l2 2h4a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1z"/></svg>
        <span class="cm-sb-item-label">6. Move Files</span>
      </a>
      <a href="/comics/?state=write"   class="cm-sb-item {% if request.GET.state == 'write' %}active{% endif %}">
        <svg class="cm-sb-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 13l2-2 7-7-2-2-7 7-2 2h2z"/><path d="M11 4l2 2"/></svg>
        <span class="cm-sb-item-label">7. Write to CBZ</span>
      </a>

      <!-- Settings -->
      <div class="cm-sb-group-label">Settings</div>
      <a href="/tagging/rulesets/"    class="cm-sb-item {% if '/tagging/rulesets' in request.path %}active{% endif %}">
        <svg class="cm-sb-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h8M2 12h5"/><path d="M12 7v6M9 10h6"/></svg>
        <span class="cm-sb-item-label">Tagging Rules</span>
      </a>
      <a href="/tagging/publishers/"  class="cm-sb-item {% if '/tagging/publishers' in request.path %}active{% endif %}">
        <svg class="cm-sb-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="5" width="12" height="9" rx="1"/><path d="M5 14V9M8 14V9M11 14V9"/><rect x="4" y="2" width="8" height="3" rx="1"/></svg>
        <span class="cm-sb-item-label">Publishers</span>
      </a>
      <a href="/organizer/profiles/"  class="cm-sb-item {% if '/organizer/profiles' in request.path %}active{% endif %}">
        <svg class="cm-sb-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12V5a1 1 0 011-1h4l2 2h4a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1z"/></svg>
        <span class="cm-sb-item-label">File Organizer</span>
      </a>
      <a href="/organizer/path-audit/" class="cm-sb-item {% if '/organizer/path-audit' in request.path %}active{% endif %}">
        <svg class="cm-sb-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12V6a1 1 0 011-1h4l1.5 1.5H13a1 1 0 011 1v4.5a1 1 0 01-1 1H3a1 1 0 01-1-1z"/><path d="M5.5 9.5l1.5 1.5 3.5-3"/></svg>
        <span class="cm-sb-item-label">Path Audit</span>
      </a>
      <a href="/organizer/au-scan/" class="cm-sb-item {% if '/organizer/au-scan' in request.path %}active{% endif %}">
        <svg class="cm-sb-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5"/><path d="M8 5v3l2 2"/></svg>
        <span class="cm-sb-item-label">AU Scan</span>
      </a>
      <a href="/settings/log/" class="cm-sb-item {% if request.path == '/settings/log/' %}active{% endif %}">
        <svg class="cm-sb-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="1" width="10" height="14" rx="1"/><path d="M5 5h6M5 8h6M5 11h4"/></svg>
        <span class="cm-sb-item-label">Audit Log</span>
      </a>
      <a href="/settings/"            class="cm-sb-item {% if request.path == '/settings/' %}active{% endif %}">
        <svg class="cm-sb-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M3.1 12.9l1.4-1.4M11.5 4.5l1.4-1.4"/></svg>
        <span class="cm-sb-item-label">Settings</span>
      </a>

    </nav>

    <div class="cm-sb-footer">
      <button class="cm-sb-collapse-btn" id="cm-sb-toggle" title="Collapse sidebar">
        <svg class="cm-sb-collapse-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 2L4 7l5 5"/></svg>
      </button>
    </div>

  </aside>
