  <!-- ── Unified Scrape Modal ──────────────────────────────────────────────── -->
  <dialog id="scrape-modal" class="modal">
    <div class="modal-box max-w-6xl" style="background:var(--cm-bg-1); border:1px solid var(--cm-border); padding:0; max-height:90vh; display:flex; flex-direction:column;">

      <!-- Header -->
      <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--cm-border); flex-shrink:0;">
        <h3 style="font-size:15px; font-weight:700; margin:0; color:var(--cm-fg-1);">
          Select Match for: <span id="scrape-modal-title" style="color:var(--cm-fg-2);">Loading...</span>
        </h3>
        <form method="dialog">
          <button style="background:none; border:none; cursor:pointer; color:var(--cm-fg-3); font-size:16px; line-height:1; padding:2px 6px;" onmouseenter="this.style.color='var(--cm-fg-1)'" onmouseleave="this.style.color='var(--cm-fg-3)'">&#x2715;</button>
        </form>
      </div>

      <!-- Body -->
      <div style="display:flex; gap:0; flex:1; overflow:hidden;">

        <!-- Left: current cover -->
        <div style="flex-shrink:0; width:164px; border-right:1px solid var(--cm-border); padding:14px 12px; display:flex; flex-direction:column; gap:8px;">
          <div style="font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--cm-fg-3);">Current File</div>
          <img id="scrape-local-cover" alt="Local cover"
               style="width:100%; height:auto; border-radius:6px; border:1px solid var(--cm-border); box-shadow:0 2px 8px rgba(0,0,0,.3);"
               onerror="this.style.display='none'" />
          <p style="font-size:11px; color:var(--cm-fg-3); margin:0;" id="scrape-local-info"></p>
        </div>

        <!-- Right: matches + search -->
        <div style="flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:12px;">

          <!-- Loading -->
          <div id="scrape-loading" style="display:flex; align-items:center; justify-content:center; padding:40px; gap:10px; color:var(--cm-fg-2);">
            <span class="loading loading-spinner loading-lg"></span>
            <span style="font-size:13px;">Searching ComicVine...</span>
          </div>

          <!-- Error -->
          <div id="scrape-error" style="display:none; background:color-mix(in srgb, var(--cm-err) 15%, transparent); border:1px solid var(--cm-err); border-radius:6px; padding:10px 14px; font-size:13px; color:var(--cm-err);">
            <span id="scrape-error-text"></span>
          </div>

          <!-- Local match cards -->
          <div id="scrape-local-matches" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px;"></div>

          <!-- ComicVine API Search -->
          <div id="scrape-api-section" style="display:none; flex-direction:column; gap:8px;">
            <div style="display:flex; align-items:center; gap:8px; margin:4px 0;">
              <div style="flex:1; height:1px; background:var(--cm-border);"></div>
              <span style="font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--cm-fg-3);">ComicVine API Search</span>
              <div style="flex:1; height:1px; background:var(--cm-border);"></div>
            </div>
            <div id="scrape-api-no-local" style="display:none; background:color-mix(in srgb, var(--cm-warn) 15%, transparent); border:1px solid var(--cm-warn); border-radius:6px; padding:8px 12px; font-size:12px; color:var(--cm-warn);">
              No local matches found. Try searching the ComicVine API.
            </div>
            <div style="display:flex; gap:6px;">
              <input type="text" id="scrape-api-input" class="cm-input" style="flex:1; font-size:12px;"
                     placeholder="Search ComicVine API… or paste 4000-XXXXXXX for a direct lookup" />
              <button type="button" class="cm-btn sm primary" onclick="scrapeSearchApi()">Search API</button>
            </div>
            <div id="scrape-api-loading" style="display:none; justify-content:center; padding:16px;">
              <span class="loading loading-spinner loading-md"></span>
            </div>
            <div id="scrape-api-error" style="display:none; border-radius:6px; padding:8px 12px; font-size:12px; border:1px solid var(--cm-err); color:var(--cm-err); background:color-mix(in srgb, var(--cm-err) 15%, transparent);">
              <span id="scrape-api-error-text"></span>
            </div>
            <div id="scrape-api-matches" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px;"></div>
          </div>

          {% if inducks_enabled %}
          <!-- Inducks Search -->
          <div id="scrape-inducks-section" style="display:none; flex-direction:column; gap:8px;">
            <div style="display:flex; align-items:center; gap:8px; margin:4px 0;">
              <div style="flex:1; height:1px; background:var(--cm-border);"></div>
              <span style="font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--cm-fg-3);">I.N.D.U.C.K.S. Search</span>
              <div style="flex:1; height:1px; background:var(--cm-border);"></div>
            </div>
            <div style="display:flex; gap:6px;">
              <input type="text" id="scrape-inducks-input" class="cm-input" style="flex:1; font-size:12px;" placeholder="Title search..." />
              {% if not inducks_country_lock %}
              <select id="scrape-inducks-country" class="cm-input" style="width:64px; font-size:12px; padding:0 6px;">
                {% for code in inducks_country_codes %}
                <option value="{{ code }}"{% if forloop.first %} selected{% endif %}>{{ code }}</option>
                {% endfor %}
              </select>
              {% endif %}
              <button type="button" class="cm-btn sm info" onclick="scrapeSearchInducks()">Search</button>
            </div>
            <div style="display:flex; gap:6px;">
              <input type="text" id="scrape-inducks-storycode" class="cm-input" style="flex:1; font-size:12px;" placeholder="Story code (e.g. D 94066)" />
              <button type="button" class="cm-btn sm" style="border-color:var(--cm-info); color:var(--cm-info);" onclick="scrapeSearchInducks('storycode')">Search</button>
              <button type="button" class="cm-btn sm" style="border-color:var(--cm-ok); color:var(--cm-ok);" onclick="scrapeMatchStoryDirect()" title="Match this story directly without selecting an issue">Match Story</button>
            </div>
            <div id="scrape-inducks-loading" style="display:none; justify-content:center; padding:16px;">
              <span class="loading loading-spinner loading-md"></span>
            </div>
            <div id="scrape-inducks-error" style="display:none; background:color-mix(in srgb, var(--cm-err) 15%, transparent); border:1px solid var(--cm-err); border-radius:6px; padding:8px 12px; font-size:12px; color:var(--cm-err);">
              <span id="scrape-inducks-error-text"></span>
            </div>
            <div id="scrape-inducks-matches" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px;"></div>
          </div>
          {% endif %}

        </div>
      </div>

      <!-- Footer -->
      <div style="display:flex; align-items:center; justify-content:flex-end; gap:8px; padding:10px 16px; border-top:1px solid var(--cm-border); flex-shrink:0;">
        <form method="dialog" style="margin:0;">
          <button class="cm-btn sm ghost">Cancel</button>
        </form>
        <button id="scrape-skip-btn" class="cm-btn sm" style="display:none; border-color:var(--cm-warn); color:var(--cm-warn);" onclick="scrapeSkip()">Skip</button>
      </div>

    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>
