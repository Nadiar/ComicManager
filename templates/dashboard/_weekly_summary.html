<div class="cm-card" style="padding:14px 18px; display:flex; align-items:center; gap:24px; flex-shrink:0;">
  <div style="flex:0 0 auto;">
    <div class="cm-section-lbl">This week</div>
    <div style="display:flex; align-items:baseline; gap:8px; margin-top:4px;">
      <span class="mono tnum" style="font-size:24px; font-weight:700; letter-spacing:-0.02em;">{{ this_week }}</span>
      <span style="font-size:11.5px; color:var(--cm-fg-3);">through pipeline</span>
    </div>
  </div>

  {# 14-bar chart: last 7 bars = accent (this week), prior 7 = fg-3 (last week) #}
  <div style="flex:1; height:44px; display:flex; align-items:flex-end; gap:3px;">
    {% for bar in week_bars %}
    <div style="flex:1; height:{{ bar.height_pct }}%; min-height:2px; background:{% if bar.is_this_week %}var(--cm-accent){% else %}var(--cm-fg-3){% endif %}; opacity:{% if bar.is_this_week %}{% if bar.is_last %}1{% else %}0.7{% endif %}{% else %}0.35{% endif %}; border-radius:1.5px;" title="{{ bar.value }} comics"></div>
    {% endfor %}
  </div>

  <div style="flex:0 0 auto; text-align:right;">
    <div class="cm-section-lbl">vs last week</div>
    <div style="display:flex; align-items:baseline; gap:6px; justify-content:flex-end; margin-top:4px;">
      <span style="font-size:14px; color:{% if week_up %}var(--cm-ok){% else %}var(--cm-err){% endif %}; font-weight:700;">
        {% if week_up %}↑{% else %}↓{% endif %} {{ delta_pct }}%
      </span>
      <span class="mono tnum" style="font-size:11.5px; color:var(--cm-fg-3);">{{ last_week }} prior</span>
    </div>
  </div>
</div>
