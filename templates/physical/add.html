{% extends "base.html" %}
{% block title %}Add Physical Comic — ComicManager{% endblock %}
{% block nav_physical %}active{% endblock %}

{% block main_class %}p-6{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
  <div class="flex items-center gap-4">
    <h1 class="text-2xl font-bold">Add Physical Comic</h1>
    <a href="{% url 'physical:import_csv' %}" class="cm-btn sm cm-no-underline">CSV Import</a>
    <a href="/comics/?medium=physical" class="cm-btn sm ghost ml-auto cm-no-underline">Back to Physical Comics</a>
  </div>

  <form method="post" class="cm-card">
    {% csrf_token %}
    <div class="cm-card-body space-y-4">

      <div>
        <label class="cm-label">Series <span style="color:var(--cm-err);">*</span></label>
        <input type="text" name="series" value="{{ form.series|default:'' }}" class="cm-input w-full" required autofocus>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="cm-label">Issue Number</label>
          <input type="text" name="number" value="{{ form.number|default:'' }}" class="cm-input w-full" placeholder="e.g. 42">
        </div>
        <div>
          <label class="cm-label">Volume (start year)</label>
          <input type="number" name="volume" value="{{ form.volume|default:'' }}" class="cm-input w-full" placeholder="e.g. 1963">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="cm-label">Year</label>
          <input type="number" name="year" value="{{ form.year|default:'' }}" class="cm-input w-full" placeholder="e.g. 1992">
        </div>
        <div>
          <label class="cm-label">Publisher</label>
          <input type="text" name="publisher" value="{{ form.publisher|default:'' }}" class="cm-input w-full">
        </div>
      </div>

      <div>
        <label class="cm-label">Title (story title)</label>
        <input type="text" name="title" value="{{ form.title|default:'' }}" class="cm-input w-full">
      </div>

      <div>
        <label class="cm-label">Format</label>
        <select name="format" class="cm-input w-full">
          {% for f in format_choices %}
          <option value="{{ f }}" {% if form.format == f %}selected{% endif %}>{{ f|default:"(none)" }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="cm-label">Storage Location</label>
        <input type="text" name="storage_location" value="{{ form.storage_location|default:'' }}" class="cm-input w-full" placeholder="e.g. Box 3, Longbox 7, Shelf A">
      </div>

      <div>
        <label class="cm-label">Notes</label>
        <textarea name="notes" class="cm-input w-full" rows="3" style="height:72px; resize:vertical;">{{ form.notes|default:'' }}</textarea>
      </div>

      <div class="flex justify-end gap-2">
        <a href="/comics/?medium=physical" class="cm-btn ghost cm-no-underline">Cancel</a>
        <button type="submit" class="cm-btn primary">Add Comic</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
