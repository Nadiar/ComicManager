<div style="background:var(--cm-ok-dim); border:1px solid var(--cm-ok); border-radius:8px; padding:14px 18px; display:flex; align-items:center; gap:10px; color:var(--cm-ok); font-size:13px; font-weight:500;">
  <span style="font-size:16px; line-height:1;">✓</span>
  <span>
    {{ processed }} comic{{ processed|pluralize }}
    {% if is_reformat %}
    re-formatted successfully.
    {% else %}
    accepted as "{{ format }}" and moved to formatted state.
    {% endif %}
  </span>
</div>
