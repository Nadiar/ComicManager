<form hx-post="{% url 'core:comic_inline_field' comic.id %}"
      hx-target="closest [hx-get]"
      hx-swap="innerHTML"
      class="flex items-center gap-1"
      onclick="event.stopPropagation()">
  {% csrf_token %}
  <input type="hidden" name="field" value="{{ field }}">

  {% if is_format %}
  <select name="value"
          class="cm-input w-full max-w-xs"
          autofocus>
    <option value="">-</option>
    {% for choice in format_choices %}
    <option value="{{ choice }}"{% if choice == current_value %} selected{% endif %}>{{ choice }}</option>
    {% endfor %}
  </select>
  {% elif field == "proposed_volume" %}
  <input type="number"
         name="value"
         value="{{ current_value }}"
         class="cm-input w-20"
         autofocus>
  {% else %}
  <input type="text"
         name="value"
         value="{{ current_value }}"
         class="cm-input w-full max-w-xs"
         autofocus>
  {% endif %}

  <button type="submit" class="cm-btn sm ok" title="Save">&#10003;</button>
  <button type="button"
          class="cm-btn sm ghost"
          title="Cancel"
          hx-get="{% url 'core:comic_inline_field' comic.id %}?field={{ field }}&cancel=1"
          hx-target="closest [hx-get]"
          hx-swap="innerHTML">&#x2715;</button>
</form>
