{% if data %}
<div style="background:var(--cm-bg-1); border:1px solid var(--cm-border); border-radius:8px; padding:14px 16px;">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:12px; flex-wrap:wrap;">
    <div style="font-size:13px; font-weight:600; color:var(--cm-fg-1);">
      Series Completion — {{ data.volume_info.name }}
      {% if data.volume_info.start_year %}<span class="cm-text-muted">({{ data.volume_info.start_year }})</span>{% endif %}
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <span class="mono tnum" style="font-size:13px; color:var(--cm-fg-2);">{{ data.owned_count }}/{{ data.total_count }} — {{ data.completion }}%</span>
      <a href="{% url 'core:series_audit' comic.pk %}" class="cm-btn sm ghost" cm-no-underline">Details</a>
    </div>
  </div>

  <div class="cm-progress {% if data.completion == 100 %}ok{% endif %}" style="height:8px; border-radius:4px;">
    <span style="width:{{ data.completion }}%; {% if data.completion < 50 %}background:var(--cm-err);{% elif data.completion < 75 %}background:var(--cm-warn);{% elif data.completion < 100 %}background:var(--cm-info);{% endif %}"></span>
  </div>

  <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--cm-fg-3); margin-top:5px;">
    <span>{{ data.owned_count }} owned</span>
    <span>{{ data.missing_count }} missing</span>
  </div>
</div>
{% endif %}
