services:

  db:
    image: postgres:16-alpine
    user: "${UID}:${GID}"
    restart: unless-stopped
    environment:
      POSTGRES_DB: comicmanager
      POSTGRES_USER: comicmanager
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comicmanager"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    user: "${UID}:${GID}"
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    command: redis-server --save 60 1 --loglevel warning

  web:
    image: ${IMAGE_REPO}/comicmanager:${IMAGE_TAG:-latest}
    user: "${UID}:${GID}"
    restart: unless-stopped
    command: gunicorn comicmanager.wsgi:application --bind 0.0.0.0:8000 --workers 4
    ports:
      - "${PORT:-8000}:8000"
    env_file: .env
    volumes:
      - ${UNTAGGED_DIR:-./untagged}:/comics/untagged
      - ${LIBRARY_DIR:-./Comics}:/comics/library
      - ./data/static:/app/static
      - ./data/covers:/app/cover_cache
      - ./data/logs:/app/logs
      # Optional: mount local database files for faster scraping (see docs/guide/scraping.md)
      # - ./data/comicvine.db:/cv_db/comicvine.db:ro
      # - ./data/latest.mcl:/cv_db/latest.mcl:ro
      # - ./data/inducks.db:/cv_db/inducks.db:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: ${IMAGE_REPO}/comicmanager:${IMAGE_TAG:-latest}
    user: "${UID}:${GID}"
    restart: unless-stopped
    command: >
      celery -A comicmanager worker
        --loglevel=info
        --queues=import,scrape,organize,write
        --concurrency=4
    env_file: .env
    volumes:
      - ${UNTAGGED_DIR:-./untagged}:/comics/untagged
      - ${LIBRARY_DIR:-./Comics}:/comics/library
      - ./data/logs:/app/logs
      # Optional: mount local database files for faster scraping (see docs/guide/scraping.md)
      # - ./data/comicvine.db:/cv_db/comicvine.db:ro
      # - ./data/latest.mcl:/cv_db/latest.mcl:ro
      # - ./data/inducks.db:/cv_db/inducks.db:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  beat:
    image: ${IMAGE_REPO}/comicmanager:${IMAGE_TAG:-latest}
    user: "${UID}:${GID}"
    restart: unless-stopped
    command: >
      celery -A comicmanager beat
        --loglevel=info
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
