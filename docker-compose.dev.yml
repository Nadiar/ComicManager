services:

  web:
    build: .                          # build locally instead of pulling image
    image: ${IMAGE_REPO}/comicmanager:dev   # locally built dev image, kept separate from the pulled prod tag
    command: >
      python manage.py runserver 0.0.0.0:8000
    environment:
      - DEBUG=True
    volumes:
      - ${UNTAGGED_DIR:-./untagged}:/comics/untagged
      - ${LIBRARY_DIR:-./Comics}:/comics/library
      - ${CV_DB_PATH:-./data/comicvine.db}:/cv_db/comicvine.db:ro
      - ${CV_MCL_PATH:-./data/latest.mcl}:/cv_db/latest.mcl:ro
      - ${INDUCKS_DB_PATH:-./data/inducks.db}:/cv_db/inducks.db:ro
      - .:/app                        # mount entire source — changes reload instantly
      - ./static:/app/static          # override base static mount for dev
      - ./data/covers:/app/cover_cache
    ports:
      - "${PORT:-8000}:8000"

  worker:
    build: .
    image: ${IMAGE_REPO}/comicmanager:dev   # locally built dev image, kept separate from the pulled prod tag
    command: >
      celery -A comicmanager worker
        --loglevel=debug
        --queues=import,scrape,organize,write
        --concurrency=2
    environment:
      - DEBUG=True
    volumes:
      - ${UNTAGGED_DIR:-./untagged}:/comics/untagged
      - ${LIBRARY_DIR:-./Comics}:/comics/library
      - ${CV_DB_PATH:-./data/comicvine.db}:/cv_db/comicvine.db:ro
      - ${CV_MCL_PATH:-./data/latest.mcl}:/cv_db/latest.mcl:ro
      - ${INDUCKS_DB_PATH:-./data/inducks.db}:/cv_db/inducks.db:ro
      - .:/app                        # same source mount — worker reloads too
      - ./data/logs:/app/logs

  beat:
    build: .
    image: ${IMAGE_REPO}/comicmanager:dev   # locally built dev image, kept separate from the pulled prod tag
    environment:
      - DEBUG=True
    volumes:
      - .:/app

  css:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npx @tailwindcss/cli -i ./static/css/input.css -o ./static/css/main.css --watch=always"
    volumes:
      - ./static:/app/static          # CSS input/output
      - ./templates:/app/templates    # scan templates for class names
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
